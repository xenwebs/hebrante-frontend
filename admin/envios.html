<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEBRANTE — Panel de envíos</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg: #111111;
    --panel: #1a1a1a;
    --border: #2c2c2c;
    --text: #eeeeee;
    --muted: #999999;
    --accent: #ffffff;
    --danger: #e05252;
    --ok: #4caf50;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 24px 16px 80px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 24px;
  }
  #loginBox {
    max-width: 360px;
    margin: 80px auto;
    padding: 24px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    text-align: center;
  }
  #loginBox input {
    width: 100%;
    padding: 10px 12px;
    margin: 12px 0;
    background: #0d0d0d;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
  }
  .btn-primary {
    background: var(--accent);
    color: #111;
    width: 100%;
  }
  .btn-confirm {
    background: var(--ok);
    color: #fff;
  }
  .btn-confirm:disabled {
    background: #2f4a30;
    color: #7a9a7a;
    cursor: default;
  }
  #app { display: none; max-width: 720px; margin: 0 auto; }
  .order-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .order-info { flex: 1; min-width: 220px; }
  .order-name { font-weight: 600; font-size: 15px; }
  .order-meta { color: var(--muted); font-size: 13px; margin-top: 4px; line-height: 1.5; }
  .order-status {
    font-size: 13px;
    padding: 6px 0;
  }
  .status-ok { color: var(--ok); }
  .status-err { color: var(--danger); }
  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 60px 0;
  }
  a { color: #8ab4f8; }
</style>
</head>
<body>

  <div id="loginBox">
    <h1>HEBRANTE</h1>
    <div class="subtitle">Panel de envíos</div>
    <input type="password" id="passwordInput" placeholder="Contraseña" autofocus>
    <button class="btn-primary" onclick="login()">Entrar</button>
    <div id="loginError" class="status-err" style="margin-top:10px; font-size:13px;"></div>
  </div>

  <div id="app">
    <h1>Pedidos pendientes de envío</h1>
    <div class="subtitle">Confirma cada pedido cuando el producto esté listo para despachar. Esto genera la guía real en Envia y se cobra en ese momento.</div>
    <div id="ordersList"></div>
  </div>

<script>
  const STORAGE_KEY = 'hebrante_admin_pw'

  function login() {
    const pw = document.getElementById('passwordInput').value.trim()
    if (!pw) return
    sessionStorage.setItem(STORAGE_KEY, pw)
    document.getElementById('loginError').textContent = ''
    loadOrders()
  }

  document.getElementById('passwordInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') login()
  })

  async function loadOrders() {
    const pw = sessionStorage.getItem(STORAGE_KEY)
    if (!pw) return

    try {
      const res = await fetch('/.netlify/functions/list-pending-shipments', {
        headers: { 'X-Admin-Password': pw }
      })

      if (res.status === 401) {
        sessionStorage.removeItem(STORAGE_KEY)
        document.getElementById('loginError').textContent = 'Contraseña incorrecta.'
        return
      }

      const json = await res.json()
      if (!res.ok || !json.success) {
        throw new Error(json.error || 'Error cargando pedidos')
      }

      document.getElementById('loginBox').style.display = 'none'
      document.getElementById('app').style.display = 'block'
      renderOrders(json.orders)
    } catch (e) {
      document.getElementById('loginError').textContent = 'Error: ' + e.message
    }
  }

  function renderOrders(orders) {
    const list = document.getElementById('ordersList')

    if (!orders.length) {
      list.innerHTML = '<div class="empty-state">No hay pedidos pendientes de envío 🎉</div>'
      return
    }

    list.innerHTML = orders.map(o => `
      <div class="order-card" id="order-${o.id}">
        <div class="order-info">
          <div class="order-name">${escapeHtml(o.name || 'Pedido #' + o.orderRef)}</div>
          <div class="order-meta">
            #${escapeHtml(String(o.orderRef))} · ${escapeHtml(o.city || '')} · $${Number(o.total || 0).toLocaleString('es-CO')} COP<br>
            ${o.items.map(escapeHtml).join(', ')}
          </div>
          <div class="order-status" id="status-${o.id}"></div>
        </div>
        <button class="btn-confirm" id="btn-${o.id}" onclick="confirmShipment('${o.id}')">
          Crear guía
        </button>
      </div>
    `).join('')
  }

  async function confirmShipment(orderId) {
    const pw = sessionStorage.getItem(STORAGE_KEY)
    const btn = document.getElementById('btn-' + orderId)
    const status = document.getElementById('status-' + orderId)

    btn.disabled = true
    btn.textContent = 'Creando...'
    status.textContent = ''

    try {
      const res = await fetch('/.netlify/functions/create-shipment', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Admin-Password': pw
        },
        body: JSON.stringify({ orderId })
      })

      const json = await res.json()

      if (!res.ok || !json.success) {
        throw new Error(json.error || 'Error desconocido')
      }

      status.className = 'order-status status-ok'
      status.innerHTML = `✅ Guía creada: ${escapeHtml(json.trackingNumber)} (${escapeHtml(json.carrier || '')})` +
        (json.labelUrl ? ` — <a href="${json.labelUrl}" target="_blank">ver etiqueta</a>` : '')
      btn.textContent = 'Creada ✓'
    } catch (e) {
      status.className = 'order-status status-err'
      status.textContent = '❌ ' + e.message
      btn.disabled = false
      btn.textContent = 'Reintentar'
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div')
    div.textContent = String(str ?? '')
    return div.innerHTML
  }

  // Autologin si ya había sesión en esta pestaña
  if (sessionStorage.getItem(STORAGE_KEY)) {
    loadOrders()
  }
</script>

</body>
</html>
